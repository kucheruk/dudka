name: Desktop GUI packages

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Test Flutter
        working-directory: apps/dudka
        run: flutter test
      - name: Build portable Windows GUI
        shell: bash
        run: ./scripts/build_windows_app.sh
      - name: Start the portable Windows app
        shell: pwsh
        run: |
          Expand-Archive dist/dudka-windows-amd64.zip -DestinationPath dist/smoke
          $gui = Resolve-Path dist/smoke/dudka-windows/dudka.exe
          $engine = Resolve-Path dist/smoke/dudka-windows/internal/dudkad.exe
          if (-not (Test-Path $engine)) { throw "internal engine missing" }
          $process = Start-Process -FilePath $gui -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "portable GUI exited early" }
          taskkill /PID $process.Id /T /F
      - uses: actions/upload-artifact@v4
        with:
          name: dudka-windows-amd64
          if-no-files-found: error
          path: dist/dudka-windows-amd64.zip

  linux:
    if: ${{ !contains(github.event.head_commit.message, '[windows-only]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build terminal Linux package
        run: ./scripts/build_linux_tui.sh
      - name: Install without system packages
        run: |
          before="$(dpkg-query -W -f='${binary:Package}\n' | sort | sha256sum)"
          DUDKA_INSTALL_DIR="$RUNNER_TEMP/bin" \
            DUDKA_ARCHIVE_URL="file://$GITHUB_WORKSPACE/dist/dudka-linux-amd64.tar.gz" \
            ./dist/install.sh
          test -x "$RUNNER_TEMP/bin/dudka"
          test -x "$RUNNER_TEMP/bin/dudkad"
          test "$before" = "$(dpkg-query -W -f='${binary:Package}\n' | sort | sha256sum)"
      - uses: actions/upload-artifact@v4
        with:
          name: dudka-linux-amd64
          if-no-files-found: error
          path: |
            dist/dudka-linux-amd64.tar.gz
            dist/install.sh
