name: dudka
description: ДУДКА Flutter shell — thin client over dudkad loopback (P060).
publish_to: "none"
version: 1.0.0+20

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.2.2
  mime: ^2.0.0
  package_info_plus: ^10.2.1
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon_master.png
    - windows/runner/resources/app_icon.ico
